{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center my-auto">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size: 6rem;"></i>
        <h1 class="display-1 mt-3">404</h1>
        <h2>Page Not Found</h2>
        <p class="text-muted">The page you are looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
            <i class="bi bi-house"></i> Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
