{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center my-auto">
        <i class="bi bi-exclamation-octagon text-danger" style="font-size: 6rem;"></i>
        <h1 class="display-1 mt-3">500</h1>
        <h2>Internal Server Error</h2>
        <p class="text-muted">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
            <i class="bi bi-house"></i> Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
