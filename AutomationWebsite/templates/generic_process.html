{% extends "layout.html" %}
{% block content %}
  <h1 data-i18n="tool_generic">Generic Processing</h1>
  <form method="post" enctype="multipart/form-data" id="process-form">
    <div>
      <label for="file" data-i18n="csv_file_label">CSV File:</label>
      <input type="file" name="file" id="file" required>
    </div>
    <div>
      <label for="epsilon" data-i18n="epsilon_label">Epsilon (m):</label>
      <small style="color: #929393; display: block; margin-top: 5px;" data-i18n="epsilon_help">To cluster and find the ax points.</small>
      <input type="text" name="epsilon" id="epsilon" required>
    </div>
    <div>
      <label for="rounding_limit" data-i18n="rounding_limit_label">Rounding Limit (m):</label>
      <small style="color: #929393; display: block; margin-top: 5px;" data-i18n="rounding_limit_help">To round the digits of ax.</small>
      <input type="text" name="rounding_limit" id="rounding_limit" required>
    </div>
    <input type="submit" value="Process" data-i18n-attr="value" data-i18n="process">
  </form>
  <div id="processing-info" style="display: none; text-align: center; margin-top: 20px;">
    <div class="spinner"></div>
    <p><span data-i18n="processing">Processing...</span> <span data-i18n="time_elapsed">Time elapsed</span>: <span id="timer">0</span> <span data-i18n="seconds">seconds</span></p>
  </div>

  <script>
    document.getElementById('process-form').addEventListener('submit', function(event) {
      event.preventDefault();
      document.getElementById('processing-info').style.display = 'block';
      let startTime = Date.now();

      const updateTimer = () => {
        let elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent = elapsed;
      };

      const timerInterval = setInterval(updateTimer, 1000);

      fetch('{{ url_for("generic_processing") }}', {
        method: 'POST',
        body: new FormData(this)
      }).then(response => response.json())
        .then(data => {
          clearInterval(timerInterval);
          document.getElementById('processing-info').style.display = 'none';
          if (data.result_url) {
            window.location.href = data.result_url;
          } else {
            alert(window.i18n ? window.i18n.t('processing_failed') : 'Processing failed');
          }
        }).catch(error => {
          clearInterval(timerInterval);
          document.getElementById('processing-info').style.display = 'none';
          alert(window.i18n ? window.i18n.t('error_occurred') : 'An error occurred');
        });
    });
  </script>
{% endblock %}
