{% extends "layout.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto;">
    <h1 style="text-align: center; margin-bottom: 30px;" data-i18n="change_password_title">Change Password</h1>
    
    <form method="POST" action="{{ url_for('change_password') }}">
        <div class="form-group">
            <label for="old_password" data-i18n="current_password">Current Password</label>
            <input type="password" id="old_password" name="old_password" required autocomplete="current-password">
        </div>
        
        <div class="form-group">
            <label for="new_password" data-i18n="new_password_label">New Password</label>
            <input type="password" id="new_password" name="new_password" required autocomplete="new-password" minlength="4">
            <small style="color: #929393; display: block; margin-top: 5px;" data-i18n="minimum_characters">Minimum 4 characters</small>
        </div>
        
        <div class="form-group">
            <label for="confirm_password" data-i18n="confirm_new_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="4">
        </div>
        
        <button type="submit" class="btn-primary" data-i18n="update_password">Update Password</button>
        <a href="{{ url_for('index') }}" class="btn-secondary" style="margin-left: 15px;" data-i18n="cancel">Cancel</a>
    </form>
</div>

<script>
    // Client-side password confirmation validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const newPass = document.getElementById('new_password').value;
        const confirmPass = document.getElementById('confirm_password').value;
        
        if (newPass !== confirmPass) {
            e.preventDefault();
            const message = window.i18n ? window.i18n.t('passwords_do_not_match_alert') : 'New passwords do not match!';
            alert(message);
        }
    });
</script>
{% endblock %}
