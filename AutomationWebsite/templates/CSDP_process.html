{% extends "layout.html" %}
{% block content %}
  <h1 data-i18n="csdp_processing_page_title">CSDP Processing</h1>
  <form method="post" enctype="multipart/form-data" id="process-form">
    <div>
      <label for="file1" data-i18n="file1_label">CSV File 1:</label>
      <small style="color: #929393; display: block; margin-top: 5px;" data-i18n="file1_help">The main file that needs preparations.</small>
      <input type="file" name="file1" id="file1" required>
    </div>
    <div>
      <label for="file2" data-i18n="file2_label">CSV File 2:</label>
      <small style="color: #929393; display: block; margin-top: 5px;" data-i18n="file2_help">The secondary file contains boundaries (using the specific trick).</small>
      <input type="file" name="file2" id="file2" required>
    </div>
    <div>
      <label for="file3" data-i18n="file3_label">CSV File 3:</label>
      <small style="color: #929393; display: block; margin-top: 5px;" data-i18n="file3_help">The full file that I can get all last nodes from.</small>
      <input type="file" name="file3" id="file3" required>
    </div>
    <input type="submit" value="Process" data-i18n-attr="value" data-i18n="process">
  </form>
  <div id="processing-info" style="display: none; text-align: center; margin-top: 20px;">
    <div class="spinner"></div>
    <p><span data-i18n="processing">Processing...</span> <span data-i18n="time_elapsed">Time elapsed</span>: <span id="timer">0</span> <span data-i18n="seconds">seconds</span></p>
  </div>

  <script>
    document.getElementById('process-form').addEventListener('submit', function(event) {
      event.preventDefault();
      document.getElementById('processing-info').style.display = 'block';
      let startTime = Date.now();

      const updateTimer = () => {
        let elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent = elapsed;
      };

      const timerInterval = setInterval(updateTimer, 1000);

      fetch('{{ url_for("CSDP_processing") }}', {
        method: 'POST',
        body: new FormData(this)
      }).then(response => response.json())
        .then(data => {
          clearInterval(timerInterval);
          document.getElementById('processing-info').style.display = 'none';
          if (data.result_url) {
            window.location.href = data.result_url;
          } else {
            alert(window.i18n ? window.i18n.t('processing_failed') : 'Processing failed');
          }
        }).catch(error => {
          clearInterval(timerInterval);
          document.getElementById('processing-info').style.display = 'none';
          alert(window.i18n ? window.i18n.t('error_occurred') : 'An error occurred');
        });
    });
  </script>
{% endblock %}
