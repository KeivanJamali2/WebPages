{% extends "base.html" %}

{% block title %}{{ _('auth.login.title') }} - PMO Website{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>{{ _('auth.login.welcome') }}</h1>
            <p>{{ _('auth.login.subtitle') }}</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="identifier">{{ _('auth.login.identifier_label') }}</label>
                <input 
                    type="text" 
                    id="identifier" 
                    name="identifier" 
                    class="form-control" 
                    placeholder="{{ _('auth.login.identifier_placeholder') }}"
                    required 
                    autofocus
                >
            </div>
            
            <div class="form-group">
                <label for="password">{{ _('auth.login.password_label') }}</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="{{ _('auth.login.password_placeholder') }}"
                    required
                >
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                {{ _('auth.login.submit') }}
            </button>
        </form>
        
        <div class="auth-footer">
            <p class="help-text">
                <strong>{{ _('auth.login.need_help') }}</strong> {{ _('auth.login.contact_admin') }}
            </p>
        </div>
    </div>
</div>
{% endblock %}
