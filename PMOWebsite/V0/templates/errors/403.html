{% extends "base.html" %}

{% block title %}403 - {{ _('errors.forbidden') }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center;">
        <h1 style="font-size: 72px; margin-bottom: 16px;">403</h1>
        <h2 style="margin-bottom: 16px;">{{ _('errors.access_denied') }}</h2>
        <p style="color: var(--color-text-secondary); margin-bottom: 32px;">
            {{ _('errors.access_denied_desc') }}
        </p>
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary">
            {{ _('errors.go_to_dashboard') }}
        </a>
    </div>
</div>
{% endblock %}
